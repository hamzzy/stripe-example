# Added by Nomos when Suggest/PR mode was enabled for this repository.
# Nomos never clones your repository; maintenance jobs run here, inside your
# own GitHub Actions boundary, and only structured results are reported back.
name: Nomos Maintenance

on:
  repository_dispatch:
    types: [nomos-maintenance]

# Least privilege. id-token lets the workflow prove which repository it is
# without any long-lived Nomos secret living in your repo.
permissions:
  contents: write
  id-token: write

concurrency:
  group: nomos-maintenance-${{ github.event.client_payload.maintenance_job_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Run the Nomos maintenance job
        # Pinned by Nomos to an immutable ref so you can audit exactly what runs.
        uses: ./.github/actions/nomos-maintenance
        with:
          api-url: https://chairs-gate-certain-gel.trycloudflare.com
          maintenance-job-id: ${{ github.event.client_payload.maintenance_job_id }}
          push-branch: true
