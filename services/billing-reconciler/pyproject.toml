[project]
name = "billing-reconciler"
version = "0.1.0"
description = "Nightly Stripe reconciliation job — second-language scan evidence"
requires-python = ">=3.11"
dependencies = [
  # Pinned deliberately: an exact pin is what makes version applicability a
  # decidable question rather than a guess. A vendor change that landed after
  # this version is applicable here; one that landed before it is not.
  "stripe>=9.12.0",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
